<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>
  
  <g transform="translate(250, 95)" text-anchor="middle">
    <!-- Wreath (Left side) -->
    <path d="M -20,60 C -60,50 -90,10 -80,-30 C -75,-50 -60,-70 -40,-80" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Wreath Leaves (Left side) -->
    <path d="M -80,-10 C -95,-15 -90,-25 -78,-20 C -70,-15 -75,-5 -80,-10 Z" fill="url(#goldGrad)" />
    <path d="M -75,15 C -90,15 -90,0 -75,5 C -65,10 -70,20 -75,15 Z" fill="url(#goldGrad)" />
    <path d="M -60,40 C -75,45 -80,30 -62,30 C -52,30 -55,40 -60,40 Z" fill="url(#goldGrad)" />
    <path d="M -70,-35 C -82,-45 -72,-52 -62,-42 C -55,-35 -62,-25 -70,-35 Z" fill="url(#goldGrad)" />
    <path d="M -50,-60 C -60,-72 -48,-75 -42,-62 C -38,-52 -45,-48 -50,-60 Z" fill="url(#goldGrad)" />

    <!-- Wreath (Right side) -->
    <path d="M 20,60 C 60,50 90,10 80,-30 C 75,-50 60,-70 40,-80" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Wreath Leaves (Right side) -->
    <path d="M 80,-10 C 95,-15 90,-25 78,-20 C 70,-15 75,-5 80,-10 Z" fill="url(#goldGrad)" />
    <path d="M 75,15 C 90,15 90,0 75,5 C 65,10 70,20 75,15 Z" fill="url(#goldGrad)" />
    <path d="M 60,40 C 75,45 80,30 62,30 C 52,30 55,40 60,40 Z" fill="url(#goldGrad)" />
    <path d="M 70,-35 C 82,-45 72,-52 62,-42 C 55,-35 62,-25 70,-35 Z" fill="url(#goldGrad)" />
    <path d="M 50,-60 C 60,-72 48,-75 42,-62 C 38,-52 45,-48 50,-60 Z" fill="url(#goldGrad)" />

    <!-- Double M Emblem -->
    <!-- M 1 -->
    <path d="M -35,30 L -35,-35 L -12,0 L 10,-35 L 10,30" fill="none" stroke="url(#redGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- M 2 (Offset to create double M effect) -->
    <path d="M -15,40 L -15,-20 L 8,15 L 30,-20 L 30,40" fill="none" stroke="#DC2626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Red Accent star in center top -->
    <polygon points="0,-50 3,-42 11,-42 5,-37 7,-29 0,-34 -7,-29 -5,-37 -11,-42 -3,-42" fill="#DC2626" />
  </g>

  <!-- Text "Sri Ganesh Enterprises" -->
  <text x="250" y="195" font-family="'Inter', 'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">
    SRI GANESH ENTERPRISES
  </text>
  
  <!-- Text "Care You..." in Script style -->
  <text x="250" y="225" font-family="'Georgia', 'Brush Script MT', cursive, serif" font-style="italic" font-size="18" fill="#F59E0B" text-anchor="middle" font-weight="600" letter-spacing="0.5">
    Care You...
  </text>
</svg>
